name: Docker Image CI

# API image build is covered by mosaic-server.yml. Kept for manual smoke builds.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Mosaic Server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Mosaic Server image (no packages/backend)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: mosaic-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
