name: Build Dev Image

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'packages/frontend/**'
      - 'packages/common/**'
      - 'blocksuite/**'
      - 'tools/**'
      - 'package.json'
      - 'yarn.lock'
      - 'Dockerfile.from-source'
      - 'docker-compose.yml'
      - 'docker-compose-dev.yml'
      - '.github/workflows/build-dev-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-dev-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push all-in-one image
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.from-source
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mosaic:latest
            ghcr.io/${{ github.repository_owner }}/mosaic:main
            ghcr.io/${{ github.repository_owner }}/mosaic:main-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
