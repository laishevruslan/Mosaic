name: Build Dev Image

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'packages/frontend/**'
      - 'packages/common/**'
      - 'blocksuite/**'
      - 'tools/**'
      - 'package.json'
      - 'yarn.lock'
      - 'Dockerfile.from-source'
      - 'docker-compose.yml'
      - 'docker-compose-dev.yml'
      - '.github/workflows/build-dev-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-dev-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push all-in-one image
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image name (GHCR requires lowercase)
        id: image
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner}/mosaic" >> "$GITHUB_OUTPUT"

      # Prefer classic PAT with write:packages in secrets.GHCR_TOKEN.
      # Otherwise GITHUB_TOKEN needs:
      #   Settings → Actions → General → Workflow permissions → Read and write
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.from-source
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:main
            ${{ steps.image.outputs.name }}:main-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
