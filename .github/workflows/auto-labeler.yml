name: 'Pull Request Labeler'

# Manual / optional on Mosaic — labeler rules target AFFiNE labels.
on:
  workflow_dispatch:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

jobs:
  triage:
    if: github.repository_owner == 'toeverything'
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/labeler@v5
