name: Mosaic Server

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'Dockerfile'
      - 'Dockerfile.from-source'
      - 'docker-compose.yml'
      - 'docker-compose-dev.yml'
      - 'docker-compose.mosaic.yml'
      - '.github/deployment/node/Dockerfile'
      - '.github/workflows/mosaic-server.yml'
      - '.github/workflows/build-images.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'Dockerfile'
      - 'Dockerfile.from-source'
      - 'docker-compose.yml'
      - 'docker-compose-dev.yml'
      - 'docker-compose.mosaic.yml'
      - '.github/deployment/node/Dockerfile'
      - '.github/workflows/mosaic-server.yml'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:

concurrency:
  group: mosaic-server-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:graphql-surface
      - run: npm run build
      - name: Upload Mosaic Server dist
        uses: actions/upload-artifact@v4
        with:
          name: mosaic-server-dist
          path: backend/dist
          if-no-files-found: error

  docker-api:
    name: Build API Docker image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image name (GHCR requires lowercase)
        id: image
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner}/mosaic-server" >> "$GITHUB_OUTPUT"
          echo "should_push=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.image.outputs.should_push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ steps.image.outputs.should_push == 'true' }}
          provenance: false
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
